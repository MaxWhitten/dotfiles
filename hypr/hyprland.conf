#env = AQ_DRM_DEVICES,/dev/dri/intel-card
#env = WLR_DRM_DEVICES,/dev/dri/intel-card

debug:disable_logs = false

monitor=eDP-1,preferred,3072x1920@60.00Hz,auto

exec-once = hyprpaper
exec-once = hypridle

input:touchpad:clickfinger_behavior = 1
input:kb_variant = dvorak

$terminal = ghostty
$fileManager = nautilus
$menu = walker
$ai = "https://chatgpt.com"
$openclaw = "https://turing.lcl"

windowrule = match:class ^(app.zen_browser.zen)$, workspace 1 silent
windowrule = match:class ^(com.mitchellh.ghostty)$, workspace 2 silent
windowrule = match:class ^(code)$, workspace 3 silent
windowrule = match:class ^(dev.zed.Zed)$, workspace 3 silent
windowrule = match:class ^(discord)$, workspace 4 silent
windowrule = match:class ^(obsidian)$, workspace 5 silent
windowrule = match:class ^(org.gnome.Nautilus)$, workspace 6 silent
windowrule = match:class ^(zen-dev)$, workspace 10 silent

windowrule {
    name = startup-spotify
    match:class = ^(spotify)$
    workspace = special:media silent
    float = on
    size = 1170 796
}

windowrule {
    name = startup-openclaw
    match:class = ^(chrome-turing\.lcl__-Default)$
    workspace = special:openclaw silent
    float = on
    size = 487 881
    move = 1030 59
}

windowrule {
    name = startup-chatgpt
    match:class = ^(chrome-chatgpt\.com__-Default)$
    workspace = special:ai silent
    float = on
    size = 487 881
    move = 1030 59
}

exec-once = ~/.config/hypr/xdph
exec-once = ~/.config/hypr/autostart
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

exec-once = elephant service enable
exec-once = systemctl --user enable --now elephant.service

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec = gsettings set org.gnome.desktop.interface gtk-theme "Nightfox-BL-MB-Dark-Carbonfox"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

env = XDG_PICTURES_DIR,/home/eclypse/Pictures

exec-once = waybar

exec-once = flatpak run app.zen_browser.zen
exec-once = ghostty
exec-once = zeditor
exec-once = gtk-launch discord
exec-once = flatpak run md.obsidian.Obsidian
exec-once = $fileManager
exec-once = flatpak run com.spotify.Client
exec-once = chromium --app=$ai
exec-once = chromium --app=$openclaw

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(f005daee) rgba(7b00ffee) rgba(219dfcee) rgba(13c4faee) 200deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 7
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1, almostLinear
    animation = fadeOut, 1, 1, almostLinear
    animation = fade, 1, 1, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 1, linear, fade
    animation = workspacesIn, 0, 1, linear, fade
    animation = workspacesOut, 0, 1, linear, fade
    animation = zoomFactor, 1, 7, quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0# -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, I, exec, chromium --app=$ai

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = Super_L&Control_R, Right, workspace, m+1
bind = Super_L&Control_R, Left, workspace, m-1 

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = SUPER SHIFT, S, exec, hyprshot -m region

# Toggle special workspace "media"
bind = SUPER, A, togglespecialworkspace, media
# Send window to special workspace "media"
bind = SUPER SHIFT, A, movetoworkspace, special:media


# special workspace notes
bind = SUPER SHIFT, K, movetoworkspace, special:notes
bind = SUPER, K, togglespecialworkspace, notes


# Toggle special workspace "ai"
bind = SUPER, M, togglespecialworkspace, ai
bind = SUPER, N, togglespecialworkspace, openclaw

# Send window to special workspace "ai"
bind = SUPER SHIFT, M, movetoworkspace, special:ai
bind = SUPER SHIFT, N, movetoworkspace, special:openclaw

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -d intel_backlight set 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -d intel_backlight set 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

binde = $mainMod SHIFT, right, resizeactive, 10 0
binde = $mainMod SHIFT, left, resizeactive, -10 0
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10

binde = $mainMod ALT, right, moveactive, 500 0
binde = $mainMod ALT, left, moveactive, -500 0
binde = $mainMod ALT, up, moveactive, 0 -500
binde = $mainMod ALT, down, moveactive, 0 500

bind = Control_R, Space, exec, playerctl -i spotify play-pause
bind = Control_R, Right, exec, playerctl next
bind = Control_R, Left, exec, playerctl previous
bind = Control_R, Up, exec, playerctl -p spotify play-pause

bind = Alt_R, Backspace, killactive,

# lock the system
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, B, exec, bzmenu -l custom --launcher-command "walker --dmenu"
